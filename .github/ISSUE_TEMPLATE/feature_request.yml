name: 💡 Feature Request
description: Suggest a new feature or improvement for the extension
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve **Like Album In Order**? Share it below! *(You can write in Italian or English).*

  - type: textarea
    id: idea
    attributes:
      label: 💡 Your idea
      description: Describe the feature or improvement you'd like to see added to the extension.
      placeholder: "Describe your proposal here..."
    validations:
      required: true