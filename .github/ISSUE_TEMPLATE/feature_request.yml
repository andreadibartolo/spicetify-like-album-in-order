name: 💡 Proponi un'idea (Feature Request)
description: Suggerisci una nuova funzionalità o un miglioramento per l'estensione
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Hai un'idea per migliorare **Like Album In Order**? Scrivila qui sotto! *(You can write in Italian or English).*

  - type: textarea
    id: idea
    attributes:
      label: 💡 La tua idea / Your idea
      description: Descrivi la funzionalità o la modifica che vorresti vedere aggiunta all'estensione.
      placeholder: "Descrivi qui la tua proposta..."
    validations:
      required: true