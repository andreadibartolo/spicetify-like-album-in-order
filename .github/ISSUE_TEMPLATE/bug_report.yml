name: 🐛 Bug Report
description: Report a bug or issue with the extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below to help us identify and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: 📝 Description of the problem
      description: Explain in a clear way what happened and what you expected to happen.
      placeholder: "E.g., Clicking 'Like in order' on a double album, the counter stops at track 15..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 Steps to reproduce the bug
      description: List the exact steps to trigger the error.
      value: |
        1. Open the album '...' (URI or album link: )
        2. Click on '...'
        3. Observe the error...
    validations:
      required: true

  - type: dropdown
    id: trigger_method
    attributes:
      label: 🖱️ From where did you initiate the action?
      options:
        - Button in the album bar ("Like in order" / "Remove Like")
        - Context menu (3 dots '...' or right-click on the album)
        - Automatic popup when clicking the '+' button on the album
        - Spotify Settings section
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 💻 Sistema Operativo
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 📦 Spotify and Spicetify versions
      description: "You can verify them by running `spicetify -v` in the terminal and checking 'About Spotify' in the client."
      placeholder: "E.g., Spotify 1.2.45.454 / Spicetify v2.38.4"
    validations:
      required: true

  - type: input
    id: delay_setting
    attributes:
      label: ⏱️ Value set for the delay (ms)
      placeholder: "E.g., 2000 ms (default)"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 🖥️ Log of the Console (DevTools)
      description: |
        1. Run `spicetify enable-devtools` in the terminal.
        2. Press `Ctrl + Shift + I` (or `Cmd + Option + I` on Mac) inside Spotify and open the **Console** tab.
        3. Type `LikeAlbumInOrder` in the *Filter* bar and paste any messages or red errors here (or attach a screenshot).
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: ✅ Preliminary Checks
      options:
        - label: I have verified that I have the latest version of the extension and have run `spicetify apply`.
          required: true